{% extends "base.html" %}
{% block title %}Aegis Academy Staff Admin (legacy){% endblock %}
{% block content %}
<!-- TODO remove before go-live: backup service login {{ decoy_user }} / {{ decoy_password }} -->
<div class="card" style="max-width: 420px;">
  <h2 style="margin-top:0;">Staff admin (legacy)</h2>
  <p style="color:var(--muted); font-size:14px;">Old administration console. Staff accounts only.</p>
  <form method="post" action="/admin-legacy">
    <label for="user">Username</label>
    <input type="text" id="user" name="user" autocomplete="username" value="">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
</div>
{% endblock %}
