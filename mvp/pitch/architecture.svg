<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5A50"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B03A2E"/>
    </marker>
    <style>
      .box { fill: #FFFFFF; stroke: #9DB5A5; stroke-width: 1.5; }
      .core { fill: #EAF4EC; stroke: #1F5E3B; stroke-width: 2; }
      .ai { fill: #EEF0FB; stroke: #4B55A8; stroke-width: 2; }
      .lead { fill: #1F5E3B; stroke: #1F5E3B; }
      .guard { fill: #FDF1E7; stroke: #C0661A; stroke-width: 2; }
      .out { fill: #F4F6F8; stroke: #5C6B78; stroke-width: 1.5; }
      .chain { fill: #FFFFFF; stroke: #1F5E3B; stroke-width: 1.5; }
      .h { font-size: 17px; font-weight: 700; fill: #1B2A22; }
      .t { font-size: 14px; fill: #1B2A22; }
      .s { font-size: 12.5px; fill: #4A5A50; }
      .w { font-size: 17px; font-weight: 700; fill: #FFFFFF; }
      .ws { font-size: 12.5px; fill: #DDEFE3; }
      .lbl { font-size: 12px; fill: #4A5A50; font-style: italic; }
      .flow { stroke: #4A5A50; stroke-width: 2; fill: none; }
      .flowRed { stroke: #B03A2E; stroke-width: 2; fill: none; }
      .dash { stroke: #4A5A50; stroke-width: 1.5; fill: none; stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="#FBFCFA"/>

  <!-- Title -->
  <text x="30" y="42" font-size="26" font-weight="700" fill="#1F5E3B">SentrAI architecture</text>
  <text x="30" y="66" class="s">AI judges and explains. Deterministic code scores and executes. Every step is written to a hash-chained audit log.</text>

  <!-- ===== Row 1: detection pipeline ===== -->
  <!-- Collectors -->
  <rect x="30" y="90" width="260" height="150" rx="10" class="box"/>
  <text x="45" y="114" class="h">Collectors</text>
  <text x="45" y="132" class="s">tail logs the system already writes</text>
  <rect x="45" y="142" width="230" height="26" rx="5" fill="#F3F7F4" stroke="#C9D8CE"/>
  <text x="55" y="160" class="t">Web: access + auth logs</text>
  <rect x="45" y="173" width="230" height="26" rx="5" fill="#F3F7F4" stroke="#C9D8CE"/>
  <text x="55" y="191" class="t">DB: query / audit log</text>
  <rect x="45" y="204" width="230" height="26" rx="5" fill="#F3F7F4" stroke="#C9D8CE"/>
  <text x="55" y="222" class="t">OS: processes, auth, ports</text>

  <!-- Rules -->
  <rect x="340" y="110" width="210" height="110" rx="10" class="core"/>
  <text x="355" y="136" class="h">Rules engine</text>
  <text x="355" y="158" class="s">signatures, e.g. UNION SELECT,</text>
  <text x="355" y="175" class="s">5 failed logins in 60 s</text>
  <text x="355" y="192" class="s">groups lines into events</text>
  <text x="355" y="209" class="s">confidence 1.0 when certain</text>

  <!-- Jev -->
  <rect x="600" y="110" width="220" height="110" rx="10" class="ai"/>
  <text x="615" y="136" class="h">Jev (TypeSafe)</text>
  <text x="615" y="158" class="s">System One, about 100 ms</text>
  <text x="615" y="175" class="s">category + probability</text>
  <text x="615" y="192" class="s">= AI confidence (0.5 to 1.0)</text>
  <text x="615" y="209" class="s">0.4 to 0.6: "needs review"</text>

  <!-- Risk engine -->
  <rect x="870" y="110" width="250" height="110" rx="10" class="core"/>
  <text x="885" y="136" class="h">Risk engine (0 to 100)</text>
  <text x="885" y="158" class="s">base x confidence x criticality</text>
  <text x="885" y="175" class="s">+ inaction penalty (+5/h, cap 30)</text>
  <text x="885" y="192" class="s">index = 100(1 - e^(-raw/60))</text>
  <text x="885" y="209" class="s">threshold 80 = autonomous</text>

  <!-- Claude explainer -->
  <rect x="1170" y="110" width="200" height="110" rx="10" class="ai" stroke-dasharray="6 4"/>
  <text x="1185" y="136" class="h">Claude</text>
  <text x="1185" y="158" class="s">off the hot path</text>
  <text x="1185" y="175" class="s">explanations, fix text,</text>
  <text x="1185" y="192" class="s">report narrative</text>
  <text x="1185" y="209" class="s">never scores or executes</text>

  <line x1="290" y1="165" x2="336" y2="165" class="flow" marker-end="url(#arrow)"/>
  <text x="296" y="156" class="lbl">events</text>
  <line x1="550" y1="165" x2="596" y2="165" class="flow" marker-end="url(#arrow)"/>
  <line x1="820" y1="165" x2="866" y2="165" class="flow" marker-end="url(#arrow)"/>
  <line x1="1166" y1="165" x2="1124" y2="165" class="dash" marker-end="url(#arrow)"/>

  <!-- ===== Row 2: agent team ===== -->
  <rect x="30" y="270" width="1340" height="320" rx="14" fill="#F2F7F3" stroke="#9DB5A5" stroke-width="1.5"/>
  <text x="50" y="296" class="h" fill="#1F5E3B">Agent team</text>
  <text x="50" y="314" class="s">MVP: Python classes in the SentrAI core, called in turn</text>

  <!-- risk engine -> Warden -->
  <path d="M995,220 L995,250 L700,250 L700,316" class="flow" marker-end="url(#arrow)"/>
  <text x="1005" y="245" class="lbl">incidents + risk index</text>

  <!-- Warden -->
  <rect x="560" y="320" width="280" height="62" rx="10" class="lead"/>
  <text x="700" y="346" class="w" text-anchor="middle">Warden (lead)</text>
  <text x="700" y="367" class="ws" text-anchor="middle">delegates, merges, owns the risk index</text>

  <!-- tree to specialists -->
  <path d="M700,382 L700,400 M135,400 L705,400 M135,400 L135,416 M325,400 L325,416 M515,400 L515,416 M705,400 L705,416" class="flow"/>

  <!-- Specialists -->
  <rect x="50" y="418" width="170" height="74" rx="9" class="box"/>
  <text x="135" y="443" class="h" text-anchor="middle">Gatehouse</text>
  <text x="135" y="462" class="s" text-anchor="middle">Web layer, WAF logs</text>
  <text x="135" y="479" class="s" text-anchor="middle">propose only</text>

  <rect x="240" y="418" width="170" height="74" rx="9" class="box"/>
  <text x="325" y="443" class="h" text-anchor="middle">Vault</text>
  <text x="325" y="462" class="s" text-anchor="middle">Database, backups</text>
  <text x="325" y="479" class="s" text-anchor="middle">propose only</text>

  <rect x="430" y="418" width="170" height="74" rx="9" class="box"/>
  <text x="515" y="443" class="h" text-anchor="middle">Watchtower</text>
  <text x="515" y="462" class="s" text-anchor="middle">Network, own-asset scans</text>
  <text x="515" y="479" class="s" text-anchor="middle">propose only</text>

  <rect x="620" y="418" width="170" height="74" rx="9" class="box" stroke="#1F5E3B" stroke-width="2.5"/>
  <text x="705" y="443" class="h" text-anchor="middle">Garrison</text>
  <text x="705" y="462" class="s" text-anchor="middle">OS: Linux / Windows</text>
  <text x="705" y="479" class="s" text-anchor="middle">runs allowlisted playbooks</text>

  <text x="50" y="522" class="s">Specialists propose fixes. No agent gets a free shell.</text>
  <text x="50" y="540" class="s">Execution only via allowlisted playbooks, each with a TTL (default 2 h).</text>
  <text x="50" y="558" class="s">Snapshot before every change; auto-rollback if verification fails.</text>

  <!-- Countersign -->
  <rect x="880" y="320" width="220" height="80" rx="10" class="guard"/>
  <text x="990" y="346" class="h" text-anchor="middle">Countersign (reviewer)</text>
  <text x="990" y="366" class="s" text-anchor="middle">must approve every</text>
  <text x="990" y="383" class="s" text-anchor="middle">autonomous action</text>
  <line x1="840" y1="351" x2="876" y2="351" class="flowRed" marker-end="url(#arrowRed)"/>
  <path d="M990,400 L990,455 L794,455" class="flowRed" marker-end="url(#arrowRed)"/>
  <text x="850" y="448" class="lbl" fill="#B03A2E">two-key approval</text>

  <!-- Watchdog -->
  <rect x="1140" y="320" width="210" height="80" rx="10" class="box"/>
  <text x="1245" y="346" class="h" text-anchor="middle">Watchdog</text>
  <text x="1245" y="366" class="s" text-anchor="middle">heartbeats; alerts if an</text>
  <text x="1245" y="383" class="s" text-anchor="middle">agent or collector goes silent</text>

  <!-- Scribe -->
  <rect x="880" y="490" width="220" height="80" rx="10" class="core"/>
  <text x="990" y="516" class="h" text-anchor="middle">Scribe (auditor)</text>
  <text x="990" y="536" class="s" text-anchor="middle">write-only hash chain,</text>
  <text x="990" y="553" class="s" text-anchor="middle">evidence report</text>

  <!-- Help Desk -->
  <rect x="1140" y="490" width="210" height="80" rx="10" class="box"/>
  <text x="1245" y="516" class="h" text-anchor="middle">Help Desk</text>
  <text x="1245" y="536" class="s" text-anchor="middle">answers operators in Telegram</text>
  <text x="1245" y="553" class="s" text-anchor="middle">"why was my IP blocked?"</text>

  <!-- ===== Row 3: outputs ===== -->
  <rect x="50" y="640" width="290" height="88" rx="10" class="out"/>
  <text x="65" y="666" class="h">Dashboard</text>
  <text x="65" y="686" class="s">Streamlit :8501</text>
  <text x="65" y="704" class="s">gauge, incident queue, timeline,</text>
  <text x="65" y="720" class="s">rollback / make permanent</text>

  <rect x="380" y="640" width="290" height="88" rx="10" class="out"/>
  <text x="395" y="666" class="h">Telegram bot</text>
  <text x="395" y="686" class="s">alerts + reminders with</text>
  <text x="395" y="704" class="s">[Approve &amp; Patch] [Reject]</text>
  <text x="395" y="720" class="s">delivery ID + ack recorded</text>

  <rect x="710" y="640" width="290" height="88" rx="10" class="out" stroke="#B03A2E" stroke-width="2"/>
  <text x="725" y="666" class="h">Target app blocklist</text>
  <text x="725" y="686" class="s">app polls GET /blocklist</text>
  <text x="725" y="704" class="s">blocked IP / user gets HTTP 403</text>
  <text x="725" y="720" class="s">expires after TTL unless made permanent</text>

  <rect x="1040" y="640" width="310" height="88" rx="10" fill="#FFFFFF" stroke="#1F5E3B" stroke-width="2"/>
  <text x="1055" y="666" class="h">Human operator / CXO</text>
  <text x="1055" y="686" class="s">approve, reject with justification,</text>
  <text x="1055" y="704" class="s">rollback, make permanent</text>
  <text x="1055" y="720" class="s">(escalation: operator &#8594; lead &#8594; CXO)</text>

  <!-- panel -> outputs -->
  <line x1="195" y1="590" x2="195" y2="636" class="flow" marker-end="url(#arrow)"/>
  <line x1="525" y1="590" x2="525" y2="636" class="flow" marker-end="url(#arrow)"/>
  <path d="M705,492 L705,612 L855,612 L855,636" class="flowRed" marker-end="url(#arrowRed)"/>
  <text x="712" y="606" class="lbl" fill="#B03A2E">containment (TTL 2 h)</text>
  <!-- Telegram <-> operator -->
  <path d="M670,700 L690,700 L690,760 L1195,760 L1195,732" class="dash" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="740" y="773" class="lbl">alerts out, button presses back</text>
  <!-- blocklist feeds target app, which collectors read -->
  <path d="M855,728 L855,745 L20,745 L20,165 L28,165" class="dash" marker-end="url(#arrow)"/>
  <text x="15" y="620" class="lbl" transform="rotate(-90 15 620)">enforced in the monitored lab app</text>

  <!-- ===== Row 4: audit chain ===== -->
  <rect x="30" y="782" width="1340" height="100" rx="12" fill="#EAF4EC" stroke="#1F5E3B" stroke-width="1.5"/>
  <text x="50" y="808" class="h" fill="#1F5E3B">Hash-chained audit log</text>
  <text x="50" y="828" class="s">events, alerts, deliveries, acks,</text>
  <text x="50" y="845" class="s">snapshots, approvals, actions,</text>
  <text x="50" y="862" class="s">rollbacks: an edit breaks the chain</text>

  <rect x="320" y="800" width="220" height="64" rx="8" class="chain"/>
  <text x="335" y="822" class="t">#41 alert delivered, Ack: none</text>
  <text x="335" y="842" class="s">prev_hash 3c9e...</text>
  <text x="335" y="858" class="s">hash 9f2c...</text>

  <rect x="590" y="800" width="220" height="64" rx="8" class="chain"/>
  <text x="605" y="822" class="t">#42 Countersign approved</text>
  <text x="605" y="842" class="s">prev_hash 9f2c...</text>
  <text x="605" y="858" class="s">hash b71a...</text>

  <rect x="860" y="800" width="220" height="64" rx="8" class="chain"/>
  <text x="875" y="822" class="t">#43 operator rollback</text>
  <text x="875" y="842" class="s">prev_hash b71a...</text>
  <text x="875" y="858" class="s">hash e04d...</text>

  <line x1="540" y1="832" x2="586" y2="832" class="flow" marker-end="url(#arrow)"/>
  <line x1="810" y1="832" x2="856" y2="832" class="flow" marker-end="url(#arrow)"/>
  <text x="1100" y="822" class="s">GET /audit returns</text>
  <text x="1100" y="840" class="t" font-weight="700" fill="#1F5E3B">chain_valid: true</text>
  <text x="1100" y="858" class="s">and feeds the evidence report</text>

  <!-- Scribe -> audit -->
  <path d="M990,570 L990,598 L1020,598 L1020,778" class="dash" marker-end="url(#arrow)"/>
</svg>
