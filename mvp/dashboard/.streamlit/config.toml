[server]
port = 8501
address = "127.0.0.1"
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

# SentrAI night-watch palette: navy surfaces, steel-blue brand accent (matches cactai_ui/console.css).
[theme]
base = "dark"
primaryColor = "#4c8dff"
backgroundColor = "#0b111d"
secondaryBackgroundColor = "#121a29"
textColor = "#e7edf6"
linkColor = "#7fb2ff"
borderColor = "#26324a"
dataframeBorderColor = "#1e293d"
dataframeHeaderBackgroundColor = "#172134"
showWidgetBorder = true
baseRadius = "10px"
buttonRadius = "9px"
font = "system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
codeFont = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
baseFontSize = 15
greenColor = "#4fb67c"
redColor = "#e5484d"
orangeColor = "#ec835a"
yellowColor = "#e8b34a"

[theme.sidebar]
backgroundColor = "#0e1524"
secondaryBackgroundColor = "#121a29"

[client]
toolbarMode = "minimal"
