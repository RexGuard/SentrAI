[server]
port = 8501
address = "127.0.0.1"
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

# SentrAI Black theme with the Mono accent: the first paint before cactai_ui/theme.py applies the saved look
# (Configuration > Appearance), which replaces these values at run time.
[theme]
base = "dark"
primaryColor = "#f5f5f5"
backgroundColor = "#0a0a0a"
secondaryBackgroundColor = "#141414"
textColor = "#f5f5f5"
linkColor = "#f5f5f5"
borderColor = "#2e2e2e"
dataframeBorderColor = "#212121"
dataframeHeaderBackgroundColor = "#1b1b1b"
showWidgetBorder = true
baseRadius = "10px"
buttonRadius = "9px"
font = "system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
codeFont = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
baseFontSize = 15
greenColor = "#4fb67c"
redColor = "#e5484d"
orangeColor = "#ec835a"
yellowColor = "#e8b34a"

[theme.sidebar]
backgroundColor = "#0f0f0f"
secondaryBackgroundColor = "#141414"

[client]
toolbarMode = "minimal"
