theme: jekyll-theme-cayman
title: SentrAI
description: Accountability-based cybersecurity + AI
baseurl: /cactai
# Pages turns these on by default; listed so the plan (no front matter) always renders.
plugins:
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
  - jekyll-relative-links
# index.html is the landing page; the README stays for GitHub only.
exclude:
  - README.md
  - "**/.venv"
  - "**/__pycache__"
  - .pytest_cache
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
  - scope:
      path: "Cybersecurity + AI.md"
    values:
      title: Project plan
      nav: plan
  - scope:
      path: ROADMAP.md
    values:
      nav: roadmap
