<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SentrAI brand kit</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon.ico" sizes="any">
<link rel="stylesheet" href="tokens.css">
<style>
body{margin:0;background:var(--sn-bg);color:var(--sn-ink);font:var(--sn-text-md)/var(--sn-leading) var(--sn-font)}
.wrap{max-width:1040px;margin:0 auto;padding:32px 16px}
h1{font-size:var(--sn-text-xl);letter-spacing:var(--sn-tracking-display);margin:0 0 4px}
h2{font-size:var(--sn-text-lg);margin:32px 0 12px}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.tile{border:1px solid var(--sn-line);border-radius:var(--sn-radius);padding:20px;display:grid;place-items:center}
.lt{background:#f5f7fb}.dk{background:#0b111d}
.sw{width:150px;border:1px solid var(--sn-line);border-radius:var(--sn-radius-sm);overflow:hidden;background:var(--sn-surface);font-size:var(--sn-text-xs)}
.sw i{display:block;height:56px}.sw div{padding:6px 8px}.sw code{font-family:var(--sn-mono)}
.btn{background:var(--sn-brand);color:var(--sn-on-brand);border:0;border-radius:var(--sn-radius-sm);padding:10px 16px;font-weight:var(--sn-weight-strong);font:inherit}
.muted{color:var(--sn-ink-soft)}
</style></head><body><div class="wrap">
<h1>SentrAI brand kit</h1><p class="muted">A sentry doesn't chase you. It just guards the gate.</p>
<h2>Logo</h2>
<div class="row"><div class="tile lt"><img src="logo.svg" width="240" alt=""></div><div class="tile dk"><img src="logo-dark.svg" width="240" alt=""></div><div class="tile lt"><img src="wordmark.svg" width="165" alt="" style="margin:14px 0"></div></div>
<h2>Mark and favicon sizes</h2>
<div class="row">
<div class="tile lt"><img src="mark.svg" width="64" alt=""></div><div class="tile dk"><img src="mark-dark.svg" width="64" alt=""></div>
<div class="tile lt" style="color:#0f1a2c"><img src="mark-mono.svg" width="64" alt=""></div>
<div class="tile lt" style="display:flex;gap:8px;align-items:center"><img src="favicon-16.png" alt=""> <img src="favicon-32.png" alt=""> <img src="favicon-48.png" alt=""></div>
<div class="tile dk" style="display:flex;gap:8px;align-items:center"><img src="favicon-16.png" alt=""> <img src="favicon-32.png" alt=""> <img src="favicon-48.png" alt=""></div>
<div class="tile dk" style="padding:8px"><img src="apple-touch-icon.png" width="90" style="border-radius:20px" alt=""></div>
</div>
<h2>Transparent PNGs (png/)</h2>
<div class="row">
<div class="tile lt" style="display:flex;gap:12px"><img src="png/mark-128.png" width="64" alt=""> <img src="png/logo-128.png" height="64" alt=""></div>
<div class="tile dk" style="display:flex;gap:12px"><img src="png/mark-128.png" width="64" alt=""> <img src="png/logo-dark-128.png" height="64" alt=""></div>
</div>
<h2>Colour (this theme)</h2><div class="row" id="sw"></div>
<h2>Type</h2>
<p style="font-size:var(--sn-text-2xl);font-weight:var(--sn-weight-display);letter-spacing:var(--sn-tracking-display);line-height:var(--sn-leading-tight);margin:0">It holds the line.</p>
<p>Body text in the system font. <a href="#" style="color:var(--sn-brand)">A link</a> and <code style="font-family:var(--sn-mono)">203.0.113.7 blocked</code>.</p>
<button class="btn">Approve block</button>
<h2>Social card</h2><img src="social-card.png" width="600" style="border-radius:12px;max-width:100%" alt="">
</div>
<script>
const n=['bg','surface','surface-2','ink','ink-soft','line','brand','brand-2','brand-soft','safe','warn','danger'];
const cs=getComputedStyle(document.documentElement);
document.getElementById('sw').innerHTML=n.map(k=>{const v=cs.getPropertyValue('--sn-'+k).trim();return `<div class="sw"><i style="background:${v}"></i><div><code>--sn-${k}</code><br>${v}</div></div>`}).join('');
</script></body></html>
